name: Browser extensions

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-extensions-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node.js for Firefox tooling
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check extension code
        run: bun run --cwd apps/extension typecheck -- --skipLibCheck

      - name: Resolve extension version
        id: metadata
        shell: bash
        run: |
          version="$(node -p "require('./apps/extension/package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match extension version v${version}."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=kanjiwritr-browser-extensions-${version}" >> "${GITHUB_OUTPUT}"

      - name: Build extensions
        env:
          KANJIWRITR_DEFAULT_SERVER_URL: ${{ vars.KANJIWRITR_DEFAULT_SERVER_URL || 'http://localhost:3000' }}
          KANJIWRITR_EXTENSION_VERSION: ${{ steps.metadata.outputs.version }}
        run: bun run build:extension

      - name: Validate Firefox extension
        run: npx --yes web-ext@10.5.0 lint --source-dir apps/extension/dist/firefox --warnings-as-errors

      - name: Package browser extensions
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          mkdir -p artifacts
          git archive \
            --format=zip \
            --output="artifacts/kanjiwritr-extension-source-${VERSION}.zip" \
            HEAD \
            apps/extension \
            packages/protocol \
            package.json \
            bun.lock \
            tsconfig.base.json
          cd apps/extension/dist/chromium
          zip -qr "${GITHUB_WORKSPACE}/artifacts/kanjiwritr-chromium-${VERSION}.zip" .
          cd "${GITHUB_WORKSPACE}/apps/extension/dist/firefox"
          zip -qr "${GITHUB_WORKSPACE}/artifacts/kanjiwritr-firefox-${VERSION}.zip" .
          cd "${GITHUB_WORKSPACE}/artifacts"
          sha256sum ./*.zip > SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Node.js for optional Firefox signing
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download packaged extensions
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts

      - name: Sign Firefox extension when AMO credentials are configured
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          if [[ -z "${AMO_JWT_ISSUER}" || -z "${AMO_JWT_SECRET}" ]]; then
            echo "::notice::AMO credentials are not configured; publishing the unsigned Firefox ZIP only."
            exit 0
          fi

          mkdir -p firefox-source firefox-signed
          unzip -q "artifacts/kanjiwritr-firefox-${VERSION}.zip" -d firefox-source
          npx --yes web-ext@10.5.0 sign \
            --source-dir firefox-source \
            --artifacts-dir firefox-signed \
            --channel unlisted \
            --upload-source-code "artifacts/kanjiwritr-extension-source-${VERSION}.zip" \
            --api-key "${AMO_JWT_ISSUER}" \
            --api-secret "${AMO_JWT_SECRET}"

          signed_file="$(find firefox-signed -maxdepth 1 -type f -name '*.xpi' -print -quit)"
          if [[ -z "${signed_file}" ]]; then
            echo "::error::Mozilla signing completed without producing an XPI."
            exit 1
          fi
          mv "${signed_file}" "artifacts/kanjiwritr-firefox-${VERSION}-signed.xpi"

      - name: Refresh checksums
        shell: bash
        run: |
          cd artifacts
          rm SHA256SUMS.txt
          for asset in ./*.zip ./*.xpi; do
            [[ -e "${asset}" ]] || continue
            sha256sum "${asset}" >> SHA256SUMS.txt
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "Kanjiwritr ${GITHUB_REF_NAME}"
          fi
