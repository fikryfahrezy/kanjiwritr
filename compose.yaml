services:
  kanjiwritr:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/kanjiwrittr.sqlite
      CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:?Set CREDENTIAL_SECRET in .env}
      RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-true}
      TRUST_CLOUDFLARE_PROXY: ${TRUST_CLOUDFLARE_PROXY:-false}
      PAIRING_RATE_LIMIT_MAX: ${PAIRING_RATE_LIMIT_MAX:-8}
      PAIRING_RATE_LIMIT_WINDOW_SECONDS: ${PAIRING_RATE_LIMIT_WINDOW_SECONDS:-3600}
      CLAIM_RATE_LIMIT_MAX: ${CLAIM_RATE_LIMIT_MAX:-20}
      CLAIM_RATE_LIMIT_WINDOW_SECONDS: ${CLAIM_RATE_LIMIT_WINDOW_SECONDS:-600}
      WEBSOCKET_RATE_LIMIT_MAX: ${WEBSOCKET_RATE_LIMIT_MAX:-40}
      WEBSOCKET_RATE_LIMIT_WINDOW_SECONDS: ${WEBSOCKET_RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - kanjiwrittr-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "process.exit((await fetch('http://127.0.0.1:3000/healthz')).ok ? 0 : 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  kanjiwrittr-data:
